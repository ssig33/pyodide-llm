# T136, stage 1: the Q8_0 GGUFs the list would take instead of the originals' safetensors (half the download), each
# held to its original by tests/gguf_check.py tensors first (T74's rule: a GGUF that does not pass is not switched to).
# The development machine checks the ones under 2 GB; the 3B and 7B need a runner's memory and disk (the 7B's
# originals are 15 GB and its GGUF 8 GB). By hand only; each check's table goes to the summary.
#
#   gh workflow run gguf.yml -f only=hf-qwen2.5-3b-instruct,hf-qwen2.5-7b-instruct
#
# T136, stage 2: candidate GGUFs not in the list yet, each against the original src/models.js pins for that item.
# The page will take the vocabulary and config.json from the original, so a difference in the GGUF's vocabulary is
# shown and not counted (gguf_check.py --original-vocabulary). One job per candidate; the eight above do not run.
#
#   gh workflow run gguf.yml -f candidates="hf-tinyllama-1.1b-chat=TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF@<commit>/tinyllama-1.1b-chat-v1.0.Q8_0.gguf"
#
# T145: every GGUF the list takes, again (the nine above with only=all, and the 19 of stage 2 with listed, each against
# the original of its vocabulary), for the tighter line of gguf_check.py (a GGUF past it: the old line stays):
#
#   gh workflow run gguf.yml -f only=all -f listed=true
#
# (T192: an empty only is not "all": the dispatch left empty takes the default, and only the 3B and the 7B ran)
#
# What comes from an input or the matrix reaches the shell through env, never written into run: (T145: a candidate
# of "$(...)" in its file name would have run).
name: GGUF against the originals

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'the model ids to check, separated by commas; all nine with all'
        default: 'hf-qwen2.5-3b-instruct,hf-qwen2.5-7b-instruct'
      candidates:
        description: 'stage 2: <id>=<repo>@<revision>/<file> of GGUFs not in the list yet, separated by spaces or commas'
        default: ''
      listed:
        description: 'stage 2 again: every GGUF of the list that takes the vocabulary of its original (T145)'
        type: boolean
        default: false

jobs:
  gguf:
    name: ${{ matrix.id }}
    if: inputs.candidates == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # the original at the revision src/models.js pins, and the GGUF (repository@revision/file)
        include:
          - { id: hf-qwen2.5-0.5b-instruct, original: Qwen/Qwen2.5-0.5B-Instruct@7ae557604adf67be50417f59c2c2f167def9a775, gguf: bartowski/Qwen2.5-0.5B-Instruct-GGUF@41ba88dbac95fed2528c92514c131d73eb5a174b/Qwen2.5-0.5B-Instruct-Q8_0.gguf }
          - { id: hf-qwen2.5-coder-0.5b-instruct, original: Qwen/Qwen2.5-Coder-0.5B-Instruct@ea3f2471cf1b1f0db85067f1ef93848e38e88c25, gguf: bartowski/Qwen2.5-Coder-0.5B-Instruct-GGUF@69a2c192eed24297fb09a34d8ba948b8624cc3e2/Qwen2.5-Coder-0.5B-Instruct-Q8_0.gguf }
          - { id: hf-smollm2-360m-instruct, original: HuggingFaceTB/SmolLM2-360M-Instruct@a10cc1512eabd3dde888204e902eca88bddb4951, gguf: HuggingFaceTB/SmolLM2-360M-Instruct-GGUF@593b5a2e04c8f3e4ee880263f93e0bd2901ad47f/smollm2-360m-instruct-q8_0.gguf }
          - { id: hf-qwen2.5-1.5b-instruct, original: Qwen/Qwen2.5-1.5B-Instruct@989aa7980e4cf806f80c7fef2b1adb7bc71aa306, gguf: bartowski/Qwen2.5-1.5B-Instruct-GGUF@9eadc66189c7641e1ddd226b8267a9119b2ce2d4/Qwen2.5-1.5B-Instruct-Q8_0.gguf }
          - { id: hf-tinyswallow-1.5b-instruct, original: SakanaAI/TinySwallow-1.5B-Instruct@91e9fcc30f56d224aea84356c4d850cc4c5a3260, gguf: SakanaAI/TinySwallow-1.5B-Instruct-GGUF@38c003aaf8be9d17af11dece1fbabeb873c567fa/tinyswallow-1.5b-instruct-q8_0.gguf }
          - { id: hf-smollm2-1.7b-instruct, original: HuggingFaceTB/SmolLM2-1.7B-Instruct@31b70e2e869a7173562077fd711b654946d38674, gguf: bartowski/SmolLM2-1.7B-Instruct-GGUF@1f03464768bfcc0319fc50da8ff5fb20b6417ba2/SmolLM2-1.7B-Instruct-Q8_0.gguf }
          - { id: hf-qwen2.5-3b-instruct, original: Qwen/Qwen2.5-3B-Instruct@aa8e72537993ba99e69dfaafa59ed015b17504d1, gguf: bartowski/Qwen2.5-3B-Instruct-GGUF@f302c64a2269a69fb27b2f9473b362f5bb8e78d8/Qwen2.5-3B-Instruct-Q8_0.gguf }
          - { id: hf-qwen2.5-7b-instruct, original: Qwen/Qwen2.5-7B-Instruct@a09a35458c702b33eeacc393d103063234e8bc28, gguf: bartowski/Qwen2.5-7B-Instruct-GGUF@8911e8a47f92bac19d6f5c64a2e2095bd2f7d031/Qwen2.5-7B-Instruct-Q8_0.gguf }
          # T74's, before stage 1 (the original at the revision tests/format_check.py's ORIGINALS names)
          - { id: hf-smollm2-135m-instruct, original: HuggingFaceTB/SmolLM2-135M-Instruct@12fd25f77366fa6b3b4b768ec3050bf629380bac, gguf: bartowski/SmolLM2-135M-Instruct-GGUF@09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q8_0.gguf }
    steps:
      - name: Checkout
        if: inputs.only == 'all' || contains(format(',{0},', inputs.only), format(',{0},', matrix.id))
        uses: actions/checkout@v7

      # the matrix cannot be chosen from an input: the jobs not asked for skip their steps. /mnt has the room (the
      # 7B's originals and its GGUF are 23 GB; / has about 14 GB free)
      - name: Fetch the original and the GGUF, and check
        if: inputs.only == 'all' || contains(format(',{0},', inputs.only), format(',{0},', matrix.id))
        shell: bash
        env:
          ID: ${{ matrix.id }}
          ORIGINAL: ${{ matrix.original }}
          GGUF: ${{ matrix.gguf }}
        run: |
          python3 -m pip install --quiet numpy
          sudo mkdir -p /mnt/gguf && sudo chown "$USER" /mnt/gguf
          python3 - "$ORIGINAL" "$GGUF" /mnt/gguf <<'EOF'
          import json, os, sys, urllib.error, urllib.request
          (repo, rev), (grepo, grest), out = sys.argv[1].split("@"), sys.argv[2].split("@"), sys.argv[3]
          grev, gfile = grest.split("/", 1)
          def get(url, name):
              with urllib.request.urlopen(url, timeout=300) as response, open(os.path.join(out, name), "wb") as f:
                  while block := response.read(8 << 20):
                      f.write(block)
          at = lambda name: f"https://huggingface.co/{repo}/resolve/{rev}/{name}"
          for name in ("config.json", "tokenizer.json"):
              get(at(name), name)
          try:
              get(at("model.safetensors"), "model.safetensors")
          except urllib.error.HTTPError:
              get(at("model.safetensors.index.json"), "model.safetensors.index.json")
              index = json.load(open(os.path.join(out, "model.safetensors.index.json")))
              for shard in sorted(set(index["weight_map"].values())):
                  get(at(shard), shard)
          get(f"https://huggingface.co/{grepo}/resolve/{grev}/{gfile}", "model.gguf")
          print(sorted(os.listdir(out)))
          EOF
          echo "### $ID: $GGUF" >> "$GITHUB_STEP_SUMMARY"
          status=0
          python3 tests/gguf_check.py tensors /mnt/gguf/model.gguf /mnt/gguf > check.md || status=$?
          { echo; tail -n 1 check.md; echo; grep -v '^| blk\.' check.md; } >> "$GITHUB_STEP_SUMMARY"
          grep -v '^| blk\.' check.md | head -n -1
          echo "gguf_check $ID: $(tail -n 1 check.md)"
          echo "gguf_check.py tensors: exit $status" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

  # stage 2: the candidates, each with its original from src/models.js
  plan:
    if: inputs.candidates != '' || inputs.listed
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        env:
          CANDIDATES: ${{ inputs.candidates }}
          LISTED: ${{ inputs.listed }}
        run: |
          node --input-type=module -e '
            const { MODELS } = await import("./src/models.js");
            // names of Hugging Face (letters, digits, "-", "_", "."): nothing a shell would read as more
            const NAME = "[A-Za-z0-9][A-Za-z0-9._-]*";
            const form = new RegExp(`^${NAME}/${NAME}@[0-9a-f]{40}/(${NAME}/)*${NAME}\\.gguf$`);
            const jobs = process.env.CANDIDATES.split(/[\s,]+/).filter(Boolean).map((pair) => {
              const [id, gguf] = pair.split("=");
              const entry = MODELS.find((model) => model.id === id);
              if (!entry?.hf) throw new Error(`${id}: no item from Hugging Face by that id in src/models.js`);
              if (!form.test(gguf ?? "")) throw new Error(`${pair}: not <id>=<repo>@<revision>/<file>`);
              // an item that takes a GGUF already (T136) has its original where its vocabulary comes from; one of
              // stage 1 (a GGUF with its own vocabulary) has no original revision in the list
              const source = entry.hf.vocabulary ?? entry.hf;
              if (source.weights?.endsWith(".gguf")) throw new Error(`${id}: takes a GGUF of its own vocabulary, and the list has no revision of its original`);
              return { id, original: `${source.repo}@${source.revision}`, gguf };
            });
            // T145: the list itself, each GGUF against the original its vocabulary comes from
            if (process.env.LISTED === "true") {
              for (const { id, hf } of MODELS.filter((model) => model.hf?.vocabulary && model.hf.weights?.endsWith(".gguf"))) {
                const gguf = `${hf.repo}@${hf.revision}/${hf.weights}`;
                // a Qwen3 is in the list twice (thinking and not, T124) with one GGUF: checked once (the review of T203)
                if (jobs.some((job) => job.id === id || job.gguf === gguf)) continue;
                jobs.push({ id, original: `${hf.vocabulary.repo}@${hf.vocabulary.revision}`, gguf });
              }
            }
            console.log(`matrix=${JSON.stringify(jobs)}`);
          ' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  candidate:
    name: ${{ matrix.id }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      # an 8B's original and its GGUF are 26 GB
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / /mnt

      - name: Fetch the original and the GGUF, and check
        shell: bash
        env:
          ID: ${{ matrix.id }}
          ORIGINAL: ${{ matrix.original }}
          GGUF: ${{ matrix.gguf }}
        run: |
          python3 -m pip install --quiet numpy
          sudo mkdir -p /mnt/gguf && sudo chown "$USER" /mnt/gguf
          python3 - "$ORIGINAL" "$GGUF" /mnt/gguf <<'EOF'
          import json, os, sys, urllib.error, urllib.request
          (repo, rev), (grepo, grest), out = sys.argv[1].split("@"), sys.argv[2].split("@"), sys.argv[3]
          grev, gfile = grest.split("/", 1)
          def get(url, name):
              with urllib.request.urlopen(url, timeout=300) as response, open(os.path.join(out, name), "wb") as f:
                  while block := response.read(8 << 20):
                      f.write(block)
          at = lambda name: f"https://huggingface.co/{repo}/resolve/{rev}/{name}"
          get(at("config.json"), "config.json")
          for name in ("tokenizer.json", "tokenizer.model"):  # whichever the original has: each is compared
              try:
                  get(at(name), name)
              except urllib.error.HTTPError as error:
                  print(name, error.code)
          try:
              get(at("model.safetensors"), "model.safetensors")
          except urllib.error.HTTPError:
              get(at("model.safetensors.index.json"), "model.safetensors.index.json")
              index = json.load(open(os.path.join(out, "model.safetensors.index.json")))
              for shard in sorted(set(index["weight_map"].values())):
                  get(at(shard), shard)
          get(f"https://huggingface.co/{grepo}/resolve/{grev}/{gfile}", "model.gguf")
          print(sorted(os.listdir(out)))
          EOF
          df -h /mnt
          echo "### $ID: $GGUF" >> "$GITHUB_STEP_SUMMARY"
          status=0
          python3 tests/gguf_check.py tensors /mnt/gguf/model.gguf /mnt/gguf --original-vocabulary > check.md || status=$?
          { echo; tail -n 2 check.md; echo; grep -v '^| blk\.' check.md; } >> "$GITHUB_STEP_SUMMARY"
          grep -v '^| blk\.' check.md | head -n -1
          echo "gguf_check $ID: $(tail -n 1 check.md)"
          echo "gguf_check.py tensors: exit $status" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

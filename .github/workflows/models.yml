# The models named here, and only those, in one browser against the deployed site (T105): to try a model before it
# goes into the list (hf:<owner>/<repository>[@<revision>] opens it by ?hf=), or to run one model of the list again
# without the whole of browsers.yml. By hand only; the table of the runs goes to the summary, as in browsers.yml.
#
#   gh workflow run models.yml -f models="hf:Qwen/Qwen2.5-3B-Instruct@aa8e72537993ba99e69dfaafa59ed015b17504d1"
name: Models by name
# what the run tried, so that runs can be told apart in the list of runs and in tests/ci.mjs (T142)
run-name: "Models: ${{ inputs.models }} · ${{ inputs.browser }} · ${{ inputs.os }}"

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'model ids of the list, or hf:<owner>/<repository>[@<revision>], separated by spaces'
        required: true
      browser:
        description: 'chromium, firefox, webkit, chrome or msedge'
        default: 'chromium'
      os:
        description: 'the runner'
        default: 'ubuntu-latest'
      timeout:
        description: 'seconds one run may take'
        default: '1800'
      twice:
        description: 'load the page again after the answer (T99: the second visit reads what the browser kept)'
        type: boolean
        default: false
      offline:
        description: 'T111: after the answer go offline, load again and answer again'
        type: boolean
        default: false
      query:
        description: 'more of the page URL for every run, such as bench=1 or hfParts=16&hfConnections=8 (gpuTest=on: the prompt on SwiftShader, T148)'
        required: false
      swiftshader:
        description: 'T148: SwiftShader as the WebGPU of Chromium without gpuTest=on: the page must refuse it and answer on the CPU'
        type: boolean
        default: false
      then:
        description: 'model ids chosen after the answer in the same page, one after another (a visitor changing models)'
        required: false
      bench:
        description: 'run tests/bench-browser.mjs (?bench=1, the console kept) instead of tests/e2e.mjs'
        type: boolean
        default: false
      long:
        description: 'T115: a prompt of the numbers 1 to this, so that the keys and values grow to a long context'
        required: false
      url:
        description: 'the site to test (default: the deployed one)'
        required: false

jobs:
  models:
    name: ${{ inputs.browser }} on ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install the test tools and the browser
        shell: bash
        run: |
          npm ci
          case "${{ inputs.browser }}" in
            chrome|msedge) ;;
            *) npx playwright-core install --with-deps "${{ inputs.browser }}" ;;
          esac

      # the ids local and hf open files of this checkout through the folder button (tests/e2e.mjs): stories260K and
      # its tokenizer, and for hf the files tests/make_hf_fixture.py writes from them with NumPy (a Python of its
      # own: macOS's refuses pip)
      - name: Set up Python
        if: contains(format(' {0} ', inputs.models), ' local ') || contains(format(' {0} ', inputs.models), ' hf ')
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: The files the folder button opens
        if: contains(format(' {0} ', inputs.models), ' local ') || contains(format(' {0} ', inputs.models), ' hf ')
        shell: bash
        run: |
          for file in stories260K.bin tok512.bin; do
            curl -sSfLO "https://huggingface.co/karpathy/tinyllamas/resolve/main/stories260K/$file"
          done
          python3 -m pip install --quiet numpy

      - name: Run
        shell: bash
        env:
          SITE: ${{ inputs.url || 'https://takano32.github.io/pyodide-llm/' }}
          E2E_TIMEOUT: ${{ inputs.timeout }}
          E2E_RESULTS: results.jsonl
          E2E_ARTIFACTS: artifacts
          E2E_TWICE: ${{ inputs.twice && '1' || '' }}
          E2E_OFFLINE: ${{ inputs.offline && '1' || '' }}
          E2E_QUERY: ${{ inputs.query }}
          E2E_GPU: ${{ inputs.swiftshader && 'swiftshader' || '' }}
          E2E_THEN: ${{ inputs.then }}
          E2E_LONG: ${{ inputs.long }}
        run: |
          node -e 'const os = require("os"); console.log(`${os.cpus()[0].model}, ${os.cpus().length} threads, ${Math.round(os.totalmem() / 1e9)} GB, ${os.arch()}`)' | tee -a "$GITHUB_STEP_SUMMARY"
          failed=0
          for model in ${{ inputs.models }}; do
            echo "### $model" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            if [ "${{ inputs.bench }}" = "true" ]; then
              node tests/bench-browser.mjs "$model" "$SITE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
            else
              node tests/e2e.mjs "$model" "${{ inputs.browser }}" "$SITE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
            fi
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          exit $failed

      - name: One table of every run
        if: always()
        shell: bash
        run: node tests/summary.mjs results.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results and what the failed runs left
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: models
          path: |
            results.jsonl
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

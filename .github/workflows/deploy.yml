name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download and convert the models, compile the kernels
        run: |
          pip install numpy pytest tokenizers regex
          npm ci
          make models kernels

      - name: Unit tests of the engine
        run: python -m pytest tests -q

      # Node alone: the benchmark's table (T45) and the table CI writes (T82)
      - name: Unit tests of the page's modules
        run: |
          node tests/bench.mjs
          node tests/summary-check.mjs
          node tests/models-check.mjs
          node tests/ladder-check.mjs
          node tests/kept-check.mjs
          node tests/coi-js-check.mjs
          node tests/gpu-choice-check.mjs
          node tests/worker-sink-check.mjs

      - name: Smoke test with the latest Pyodide
        run: |
          # the page resolves the latest Pyodide release when it is opened, so test against that one
          npm install --no-save pyodide@latest
          node tests/smoke.mjs
          # T93: the forward pass of public/forward.js against NumPy's, on the site's models (the line is for 128 positions)
          node tests/forward-check.mjs --rounds 1 --positions 128
          node tests/forward-check.mjs stories260K tiny-lm --rounds 1 --positions 128 --plain
          # T148: the default choice of the GPU or the CPU for a prompt's blocks, with a made-up GPU's worker
          node tests/gpu-default-check.mjs
          # T101: the 64-bit memory and its kernels (the review: nothing ran them before a change went out)
          node tests/forward-check.mjs stories260K tiny-lm --rounds 1 --positions 128 --wide

      - name: Build the site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

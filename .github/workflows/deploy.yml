name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# a deploy is not cancelled halfway (Pages); GitHub folds the queue to the newest waiting one (T193)
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download and convert the models, compile the kernels
        run: |
          pip install numpy pytest tokenizers regex sentencepiece
          npm ci
          make models kernels

      # T193: the light suite only (what keeps a broken page off the site: pytest, the page's modules, smoke). The heavier
      # checks run in tests.yml, every night (its schedule) and on a branch with full=true: a commit on main that this
      # suite cannot tell apart is checked by the next full suite.
      - name: Tests (the light suite)
        run: |
          echo "suite: light, by ${{ github.event_name }}"
          bash tests/suite.sh light

      - name: Build the site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

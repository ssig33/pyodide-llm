# T98, stages 1 and 2: what 4-, 5- and 6-bit weights cost in quality, on models the development machine has not the memory for
# (tests/int4_check.py: the page's int8 and several int4 formats of our own, and llama.cpp's Q4_0 and Q4_K_M where a
# GGUF of the same model exists). By hand only; the tables go to the summary.
name: int4 weights

on:
  workflow_dispatch:
    inputs:
      rows:
        description: 'only the rows whose label begins with these, separated by commas (e.g. int5,int6,int8); all when empty'
        default: ''
      size:
        description: 'small: the five models of stages 1 and 2; large: three of 1B and more (T98, checking 6 bits)'
        type: choice
        options: [small, large]
        default: small

jobs:
  int4:
    name: ${{ matrix.model }} (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # the list takes these from a GGUF (T74, T136): the originals' safetensors are what the formats are applied to
          - model: hf:HuggingFaceTB/SmolLM2-135M-Instruct@12fd25f77366fa6b3b4b768ec3050bf629380bac
            language: en
            ggufs: >-
              Q4_K_M=https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/09816acd5d99df7be770d85ea30822623dab342c/SmolLM2-135M-Instruct-Q4_K_M.gguf
          - model: hf:HuggingFaceTB/SmolLM2-360M-Instruct@a10cc1512eabd3dde888204e902eca88bddb4951
            language: en
            ggufs: >-
              Q4_0=https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/7be6f65f1db715fe5dc5a4634c0d459b4eed42ec/SmolLM2-360M-Instruct-Q4_0.gguf
              Q4_K_M=https://huggingface.co/bartowski/SmolLM2-360M-Instruct-GGUF/resolve/7be6f65f1db715fe5dc5a4634c0d459b4eed42ec/SmolLM2-360M-Instruct-Q4_K_M.gguf
          - { model: 'hf:Qwen/Qwen2.5-0.5B-Instruct@7ae557604adf67be50417f59c2c2f167def9a775', language: en, ggufs: '' }
          - { model: hf-llm-jp-3-440m-instruct3, language: ja, ggufs: '' }
          - { model: 'hf:EleutherAI/pythia-410m@9879c9b5f8bea9051dcb0e68dff21493d67e9d4f', language: en, ggufs: '' }
          # a gigabyte and more: the float32 of a 1.5B is 6 GB, which a runner (16 GB) holds
          - { model: 'hf:llm-jp/llm-jp-3-980m-instruct3@c079dbf3f88aa2ab702b9696231fc3336c46b1be', language: ja, ggufs: '', size: large }
          - { model: 'hf:unsloth/Llama-3.2-1B-Instruct@5a8abab4a5d6f164389b1079fb721cfab8d7126c', language: en, ggufs: '', size: large }
          - { model: 'hf:Qwen/Qwen2.5-1.5B-Instruct@989aa7980e4cf806f80c7fef2b1adb7bc71aa306', language: en, ggufs: '', size: large }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # the matrix cannot be chosen from an input: the jobs of the other size skip their steps
      - name: Fetch the model, its GGUFs and the text
        if: (matrix.size || 'small') == inputs.size
        shell: bash
        run: |
          python3 -m pip install --quiet numpy
          source=$(python3 tests/hf_fetch.py ${{ matrix.model }} downloads)
          echo "SOURCE=$source" >> "$GITHUB_ENV"
          python3 tests/perplexity_prepare.py "$source" prepared int8
          ggufs=""
          for pair in ${{ matrix.ggufs }}; do
            name=${pair%%=*}; url=${pair#*=}
            curl -sfL -o "$name.gguf" "$url"
            ggufs="$ggufs $name=$PWD/$name.gguf"
          done
          echo "GGUFS=$ggufs" >> "$GITHUB_ENV"
          node tests/wikipedia.mjs ${{ matrix.language }} text.txt

      - name: Measure
        if: (matrix.size || 'small') == inputs.size
        shell: bash
        env:
          INT4_ROWS: ${{ inputs.rows }}
        run: python3 tests/int4_check.py "$SOURCE" prepared text.txt 1500 $GGUFS | tee -a "$GITHUB_STEP_SUMMARY"

# Screenshots of the page as a branch has it, before it goes out (AGENTS.md: a drawing task shows a phone-width and
# a desktop-width screenshot to the owner first). Builds the site with its smallest model only, serves it from the
# runner and runs tests/screenshots.mjs in Chromium. By hand only: pick the branch when running it.
name: Preview screenshots

on:
  workflow_dispatch:
    inputs:
      offline:
        description: 'T111: also open the branch in Chromium, Firefox and WebKit, go offline, load again and answer'
        type: boolean
        default: false
      model:
        description: 'T184: the model of /benchmark/ (stories15M is int8: its prompts can go on the GPU)'
        type: choice
        options: [stories260K, stories15M]
        default: stories260K
      query:
        description: 'T184: more of /benchmark/''s query, e.g. gpuTest=on (the fallback adapter taken as a GPU: its side of the page path)'
        type: string
        default: ''

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build the site with its smallest model
        shell: bash
        run: |
          npm ci
          python3 -m pip install --quiet numpy
          make kernels stories260K.bin tok512.bin
          mkdir -p public/models
          split -b 8388608 -d -a 3 stories260K.bin public/models/stories260K.bin.
          cp tok512.bin public/models/
          if [ "${{ inputs.model }}" = stories15M ]; then
            make stories15M.bin tokenizer.bin
            split -b 8388608 -d -a 3 stories15M.bin public/models/stories15M.bin.
            cp tokenizer.bin public/models/
          fi
          npm run build
          npx playwright-core install --with-deps chromium

      - name: Take the screenshots
        run: node tests/screenshots.mjs screenshots

      # T134: /benchmark/ of this branch, every section in Chromium (tests/bench-check.mjs serves dist/ itself)
      - name: The benchmark page
        shell: bash
        env:
          MODEL: ${{ inputs.model || 'stories260K' }}
          QUERY: ${{ inputs.query }}
        run: node tests/bench-check.mjs --dist chromium --model "$MODEL" --size 64 --query "$QUERY" | tee -a "$GITHUB_STEP_SUMMARY"

      # T214: the model section where the browser does not say its memory (Safari, Firefox): the round without the
      # kernels is a row that says why, and never loads
      - name: The benchmark's model section without deviceMemory
        if: always()
        shell: bash
        run: node tests/bench-check.mjs --dist chromium --model stories260K --size 64 --run model --unsaid | tee -a "$GITHUB_STEP_SUMMARY"

      # T173: the page-memory section, on a limit the runner holds well below its own, and a tab ended in the middle of
      # it played by loading the page again (never Run all: it may end a phone's tab)
      - name: The benchmark's page memory
        if: always()
        shell: bash
        run: node tests/page-memory-check.mjs --dist | tee -a "$GITHUB_STEP_SUMMARY"

      # T173's review: the tab ended by the kernel for its memory, as a phone's jetsam or low-memory killer ends it (no
      # error in the page): the whole browser in a cgroup of 2 GiB with no swap, the section asked for its 4 GiB. The
      # page loaded again must say it held less than 2 GiB (the runner's swap stays off for the steps after it).
      - name: The benchmark's page memory, the tab ended for its memory
        if: always()
        shell: bash
        run: |
          sudo swapoff -a
          sudo mkdir -p /sys/fs/cgroup/page-memory
          echo 2G | sudo tee /sys/fs/cgroup/page-memory/memory.max
          echo $$ | sudo tee /sys/fs/cgroup/page-memory/cgroup.procs
          node tests/page-memory-check.mjs --dist --ended 2048 | tee -a "$GITHUB_STEP_SUMMARY"

      # a change to the service worker is tried here, on the branch, before it goes out (AGENTS.md)
      - name: Offline (T111)
        if: inputs.offline
        shell: bash
        run: |
          npx playwright-core install --with-deps firefox webkit
          failed=0
          for browser in chromium firefox webkit; do
            E2E_OFFLINE=1 E2E_ARTIFACTS=offline node tests/e2e.mjs stories260K "$browser" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
          done
          exit $failed

      - name: Keep what the failed offline runs left
        if: failure() && inputs.offline
        uses: actions/upload-artifact@v7
        with:
          name: offline
          path: offline/
          retention-days: 14

      - name: Keep them
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

name: Browsers

# The development machine is one ARM box with Chromium and Firefox. This is where the deployed site meets everything
# else that GitHub's runners offer: five systems (Linux and Windows on x86-64 and on ARM, macOS on Apple silicon),
# one job each, and in every job all the browsers Playwright can start there, one after the other: its own
# Chromium, Firefox and WebKit builds, and the Chrome and Edge that the runner has installed (the real browsers, as
# channels of chromium). By hand (gh workflow run browsers.yml) or once a week. Each job writes what it saw into
# its summary: which kernels a browser got (WebKit has no relaxed SIMD, so int8 falls back to matmul_q8) and how
# fast they were. Playwright's WebKit is close to Safari, not Safari itself. The runners are shared virtual
# machines: good for "does it run, and on which kernels", not for comparing speeds across systems.
on:
  workflow_dispatch:
    inputs:
      url:
        description: The site to test
        default: https://takano32.github.io/pyodide-llm/
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  system:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # one job per system, its browsers one after the other: 23 jobs of a few minutes each were more to look at
      # than they were worth
      matrix:
        include:
          - { os: ubuntu-latest, browsers: chromium firefox webkit chrome msedge }
          # Google and Microsoft publish neither Chrome nor Edge for Linux on ARM
          - { os: ubuntu-24.04-arm, browsers: chromium firefox webkit }
          - { os: windows-latest, browsers: chromium firefox webkit chrome msedge }
          - { os: windows-11-arm, browsers: chromium firefox webkit chrome msedge }
          - { os: macos-latest, browsers: chromium firefox webkit chrome msedge }
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install the test tools
        run: npm ci

      # chrome and msedge are what the runner has installed; when it has not, Playwright installs them
      - name: Install the browsers
        shell: bash
        run: |
          for browser in ${{ matrix.browsers }}; do
            case "$browser" in
              chrome|msedge) node -e 'require("playwright-core").chromium.launch({ channel: process.argv[1] }).then((b) => b.close())' "$browser" || npx playwright-core install "$browser" ;;
              *) npx playwright-core install --with-deps "$browser" ;;
            esac
          done

      - name: Run the models in every browser
        shell: bash  # also on Windows, and with pipefail, so that a failed test is not hidden by tee
        env:
          SITE: ${{ inputs.url || 'https://takano32.github.io/pyodide-llm/' }}
          # T82: every run has its own limit, is recorded as one JSON line, and leaves its screenshot, DOM and
          # console behind when it fails, so that one stuck browser costs ten minutes and not the whole job
          E2E_TIMEOUT: 600
          E2E_RESULTS: results.jsonl
          E2E_ARTIFACTS: artifacts
        run: |
          node -e 'const os = require("os"); console.log(`${os.cpus()[0].model}, ${os.cpus().length} threads, ${os.arch()}, ${os.platform()}`)' | tee -a "$GITHUB_STEP_SUMMARY"
          failed=0
          for browser in ${{ matrix.browsers }}; do
            echo "## $browser" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # float32, int8 with a small and with the largest vocabulary
            for model in stories260K stories15M tiny-lm llm-jp-3-150m; do
              node tests/e2e.mjs "$model" "$browser" "$SITE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
            done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          # The Firefox of the runner itself, driven by Selenium. Playwright drives its Firefox through the debugger,
          # which makes it compile WebAssembly for debugging, many times slower: this one tells how fast Firefox is.
          echo "## stock firefox (Selenium)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for model in stories260K stories15M tiny-lm llm-jp-3-150m; do
            node tests/stock-firefox.mjs "$model" "$SITE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $failed

      - name: One table of every run
        if: always()
        shell: bash
        run: |
          echo "## Every run" >> "$GITHUB_STEP_SUMMARY"
          node tests/summary.mjs results.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results and what the failed runs left
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browsers-${{ matrix.os }}
          path: |
            results.jsonl
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

  # The models that the page fetches from huggingface.co and converts itself, the two of more than a billion
  # parameters among them: the development machine has not the memory for those (and from 2026-09-21 the owner
  # would rather this job checked all of them, the 1.6 GB ones included). Chromium on Linux, and three of them in
  # WebKit (T112: fetching from Hugging Face is where WebKit differed); the rest of how the browsers differ is what
  # the jobs above are for.
  huggingface:
    name: models from Hugging Face (${{ matrix.size }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # under a gigabyte each: everything the page offers without a warning
          - size: small
            timeout: 900
            models: >-
              url hf-llm-jp-3-150m-instruct3 hf-japanese-gpt2-small hf-japanese-gpt-neox-small
              hf-qwen2.5-0.5b-instruct hf-llm-jp-3-440m hf-llm-jp-3-440m-instruct3
              hf-pythia-70m hf-smollm2-135m-instruct hf-pythia-160m hf-gpt2 hf-smollm2-360m-instruct
              hf-pythia-410m hf-qwen2.5-coder-0.5b-instruct
          # a gigabyte and more: these are the "desktop only" ones, and together they are 20 GB of downloads
          - size: large
            timeout: 1800
            models: >-
              hf-sarashina2.2-0.5b hf-sarashina2.2-0.5b-instruct hf-llm-jp-3-980m-instruct3
              hf-pythia-1b hf-tinyllama-1.1b-chat hf-llama-3.2-1b-instruct hf-pythia-1.4b hf-qwen2.5-1.5b-instruct
              hf-deepseek-r1-qwen-1.5b
          # the models T81 added (2026-09-26), 17 GB of downloads more, and T126's rinna 1B (2.7 GB): a job of their own
          - size: added
            timeout: 1800
            models: >-
              hf-cat-translate-0.8b hf-sarashina2.2-1b-instruct hf-cat-translate-1.4b hf-tinyswallow-1.5b-instruct
              hf-llm-jp-3.1-1.8b-instruct4 hf-smollm2-1.7b-instruct hf-japanese-gpt-1b
          # T132 (2026-09-26): 3B to 8B, 68 GB of downloads; the 7 to 8B ones on a 64-bit memory with a heap of 9.7 to
          # 11 GB (the runner has 16). In models.yml each took 2 to 4 minutes to be ready
          - size: huge
            timeout: 3000
            models: >-
              hf-qwen2.5-3b-instruct hf-sarashina2.2-3b-instruct hf-llama-3.2-3b-instruct hf-qwen2.5-7b-instruct
              hf-llama-3.1-swallow-8b-instruct hf-llm-jp-4-8b-instruct
          # T125 (2026-09-26): the Mistrals, 76 GB of downloads (five of them 7B, on a 64-bit memory)
          - size: mistral
            timeout: 3000
            models: >-
              hf-rakutenai-2.0-mini-instruct hf-rakutenai-7b-chat hf-swallow-ms-7b-instruct hf-mistral-7b-instruct-v0.2
              hf-mistral-7b-instruct-v0.3 hf-zephyr-7b-beta
          # T124 (2026-09-26): Qwen3, 33 GB of downloads (64 GB before T203's Q8_0 GGUFs). The two forms of a Qwen3
          # (thinking and not) share the weights and differ in the format alone, so both only for the 0.6B and one of
          # each other pair
          - size: qwen3
            timeout: 3000
            models: >-
              hf-qwen3-0.6b-thinking hf-qwen3-0.6b hf-qwen3-1.7b hf-qwen3-4b hf-qwen3-4b-instruct-2507
              hf-qwen3-4b-thinking-2507 hf-qwen3-8b hf-qwen3-swallow-8b-thinking
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install the test tools and Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium ${{ matrix.size == 'small' && 'webkit' || '' }}

      - name: Fetch, convert and run
        shell: bash
        env:
          SITE: ${{ inputs.url || 'https://takano32.github.io/pyodide-llm/' }}
          E2E_TIMEOUT: ${{ matrix.timeout }}
          E2E_RESULTS: results.jsonl
          E2E_ARTIFACTS: artifacts
        run: |
          node -e 'const os = require("os"); console.log(`${os.cpus()[0].model}, ${os.cpus().length} threads, ${Math.round(os.totalmem() / 1e9)} GB, ${os.arch()}`)' | tee -a "$GITHUB_STEP_SUMMARY"
          failed=0
          for model in ${{ matrix.models }}; do
            echo "### $model" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            node tests/e2e.mjs "$model" chromium "$SITE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          exit $failed

      # T112: WebKit fetched and converted wrongly where Chromium did not (Content-Range behind an expose-headers
      # wildcard, a range answered with the whole file): three of the small ones, a safetensors, a GGUF and a Qwen,
      # in WebKit as well
      - name: Three of them in WebKit (T112)
        if: always() && matrix.size == 'small'
        shell: bash
        env:
          SITE: ${{ inputs.url || 'https://takano32.github.io/pyodide-llm/' }}
          E2E_TIMEOUT: ${{ matrix.timeout }}
          E2E_RESULTS: results.jsonl
          E2E_ARTIFACTS: artifacts
        run: |
          failed=0
          for model in hf-llm-jp-3-150m-instruct3 hf-smollm2-135m-instruct hf-qwen2.5-0.5b-instruct; do
            echo "### $model in WebKit" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            node tests/e2e.mjs "$model" webkit "$SITE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || failed=1
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          exit $failed

      # T45: the benchmark a visitor can run and paste into an issue. Once is enough: it is the same code path
      # for every model, and this runner's numbers mean nothing on their own.
      - name: The benchmark of ?bench=1
        if: matrix.size == 'small'
        shell: bash
        env:
          SITE: ${{ inputs.url || 'https://takano32.github.io/pyodide-llm/' }}
        run: |
          echo "### ?bench=1" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node tests/bench-browser.mjs tiny-lm "$SITE" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # T86: real models (tests/fixed_outputs.py's MODELS: GPT-NeoX, GPT-2 from GGUFs and from a safetensors, Llamas, a
      # Qwen3) against the text a
      # person read and found sound. Not the site: the converter and engine of this checkout, in native Python, so
      # "it runs but writes nonsense" (T72) fails here. Once is enough, so only in the small half.
      - name: Real models write what they wrote before (T86)
        if: always() && matrix.size == 'small'
        shell: bash
        run: |
          python3 -m pip install --quiet numpy
          echo "### Fixed outputs (T86)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tests/fixed_outputs.py "$RUNNER_TEMP/fixed" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: One table of every run
        if: always()
        shell: bash
        run: |
          echo "## Every run" >> "$GITHUB_STEP_SUMMARY"
          node tests/summary.mjs results.jsonl >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results and what the failed runs left
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: huggingface-${{ matrix.size }}
          path: |
            results.jsonl
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

name: Tests

# T188: the tests the deploy runs, and more, on any branch (--ref), without deploying: the development machine (an ARM
# box of 2 cores, shared) runs none of them any more (the owner, 2026-09-27: "いったん、テスト CI だけにしねぇか？").
# `extra` runs more commands after them, for a branch's own measurements (the same process takes the old and the new,
# as AGENTS.md says).
#
# T193 (the owner, 2026-09-27: "たまーにフルテストする感じでコミットたくさんあるときは軽くしたい"): by default the light
# suite, the very steps the deploy runs (tests/suite.sh light: pytest, the page's modules, smoke; then the build).
# full=true, and the nightly schedule on main, run the full one (tests/suite.sh full: and forward-check shared, --plain
# and --wide, gpu-default-check, threads-check). An empty full= is the default, light (a dispatch fills an empty input
# with its default: T192).
#
#   node tests/ci.mjs run tests.yml [full=true] [extra="node tests/profile.mjs"] [runner=ubuntu-24.04-arm] --ref <branch>
on:
  schedule:
    # every night at 03:17 in Japan (18:17 UTC; off the hour, when GitHub's schedules crowd), the full suite on main
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'T193: the full suite (forward-check, gpu-default-check, threads-check too), not only the light one the deploy runs'
        type: boolean
        required: false
        default: false
      extra:
        description: 'more shell commands to run after the tests (optional), e.g. node tests/profile.mjs --from 4000'
        required: false
        default: ''
      runner:
        description: 'the runner (optional), e.g. ubuntu-24.04-arm for arm64 (T166: a kernel measured where it matters)'
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ (github.event_name == 'schedule' || inputs.full == true || inputs.full == 'true') && 'full' || 'light' }})
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Download and convert the models, compile the kernels
        run: |
          pip install numpy pytest tokenizers regex
          npm ci
          make models kernels

      - name: Tests (tests/suite.sh)
        env:
          SUITE: ${{ (github.event_name == 'schedule' || inputs.full == true || inputs.full == 'true') && 'full' || 'light' }}
          WHY: ${{ github.event_name }}
        run: |
          echo "suite: $SUITE, by $WHY, $(node -p 'require("os").cpus()[0].model')"
          bash tests/suite.sh "$SUITE"

      - name: Build the site
        run: npm run build

      - name: More
        if: ${{ inputs.extra != '' }}
        env:
          EXTRA: ${{ inputs.extra }}
        run: bash -c "$EXTRA"
